name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run mode (no actual publish)"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to NPM
        run: |
          DRY_RUN=${{ inputs.dry_run || github.event.inputs.dry_run == 'true' }}
          OTP=${{ vars.NPM_OTP_SECRET }}

          for pkg in packages/*/; do
            pkg_name=$(node -p "require('./' + '$pkg'.replace(/\/$/, '') + '/package.json').name")
            if [[ "$pkg_name" == @semanticraft/* ]]; then
              publish_cmd="npm publish --access public --tolerate-republish"
              if [[ -n "$OTP" ]]; then
                publish_cmd="$publish_cmd --otp=$OTP"
              fi
              if [[ "$DRY_RUN" == "true" ]]; then
                publish_cmd="$publish_cmd --dry-run"
              fi
              (cd "$pkg" && eval "$publish_cmd")
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*/dist/**/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}